name: Update GitHub Stats

# Refresh the live GitHub stats in README.md every 4 days, and on demand.
on:
  schedule:
    - cron: "0 3 */4 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-lines skips the slow repo-cloning line count (see scripts/update-stats.mjs)
        run: node scripts/update-stats.mjs --no-lines

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "::notice::No stat changes — skipping commit"
          else
            git commit -m "chore: refresh GitHub stats [skip ci]"
            git push
          fi
